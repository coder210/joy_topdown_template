name: Build joy_topdown_template For Web

# 独立仓库：引擎位于 third_party/joy（submodule）。
# 产物上传为 Pages artifact，并由 deploy job 发布到 GitHub Pages。
on:
  workflow_dispatch:
  pull_request:

jobs:
  build-web:
    name: Build for Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # 引擎仓 joy 目前是私有：需要 SUBMODULE_TOKEN（对 joy 有 Contents:Read 的 PAT）。
          # 引擎公开后这行可保留，会自动回落到 github.token。
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Get Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git --depth=1
          cd emsdk
          ./emsdk install 3.1.64
          ./emsdk activate 3.1.64

      - name: Configure with Emscripten
        # -fno-strict-aliasing: 引擎 jmsgpack.c / protocol.h 用 (msgpack_object*)<->(jmsgpack_object_t*)
        # 类型双关访问同一块 zone 内存，属于严格别名违规；clang 在 wasm(-O3) 下做 TBAA 优化会把对
        # 嵌套数组元素的读取优化成乱值，导致 unpack_command 在嵌套层失败（Windows/MSVC 不做该优化故正常）。
        # 关掉它即可根除，不引入其它影响。
        run: |
          source emsdk/emsdk_env.sh
          # 网页版强制单线程：SharedArrayBuffer 需要 COOP/COEP 跨域隔离头，
          # 而 GitHub Pages 无法自定义响应头，一旦构建带 pthread/共享内存就会
          # 在浏览器里报 "SharedArrayBuffer is not defined"。
          # 所以编译与链接都要显式关掉：USE_PTHREADS / SHARED_MEMORY /
          # WASM_WORKERS / PROXY_TO_PTHREAD，并限定 ENVIRONMENT=web。
          emcmake cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_PTHREADS=OFF \
            -DCMAKE_C_FLAGS="-s USE_PTHREADS=0 -fno-strict-aliasing" \
            -DCMAKE_CXX_FLAGS="-s USE_PTHREADS=0 -s DISABLE_EXCEPTION_CATCHING=0 -fno-strict-aliasing" \
            -DCMAKE_EXE_LINKER_FLAGS="-s ALLOW_MEMORY_GROWTH=1 -s TOTAL_MEMORY=256MB -s STACK_SIZE=5MB -s USE_PTHREADS=0 -s SHARED_MEMORY=0 -s WASM_WORKERS=0 -s PROXY_TO_PTHREAD=0 -s ENVIRONMENT=web"

      - name: Build
        run: |
          source emsdk/emsdk_env.sh
          cmake --build build --parallel --verbose

      - name: Prepare for upload
        run: |
          mkdir -p _site
          cp -L build/Release/*.wasm build/Release/*.js build/Release/*.html build/Release/*.data _site/ || true
          if [ -f "_site/joy_topdown_template.html" ]; then
            mv "_site/joy_topdown_template.html" "_site/index.html"
          fi
          # 网页图标：Emscripten 下不能用 window_set_icon（SDL 的 EM_ASM 依赖
          # SharedArrayBuffer），改用 HTML 的 <link rel="icon">
          if [ -f "logo.png" ]; then
            cp logo.png _site/favicon.png
            sed -i 's#<head>#<head><link rel="icon" type="image/png" href="favicon.png">#' _site/index.html
          fi
          find _site -type l -delete

      - name: Verify no symlinks remain
        run: |
          if [ $(find _site -type l | wc -l) -ne 0 ]; then
            echo "::error::Symlinks still exist in artifact"
            exit 1
          fi

      - name: List upload directory content
        run: ls -la _site/

      - name: Fix permissions
        run: |
          chmod -c -R +rX "_site" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: joy_topdown_template-web
          retention-days: 7
          path: _site/

  deploy:
    needs: build-web
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: joy_topdown_template-web
