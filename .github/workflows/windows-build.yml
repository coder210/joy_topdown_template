name: Build joy_topdown_template for Windows

# 桌面平台之一：Windows（x64 / ARM64 矩阵）。
# 由 _ci/build.yml 的 build-win job 拆分而来；只构建本项目目标 joy_topdown_template。
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build-win:
    name: Build for Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Configure
        shell: cmd
        run: |
          cmake -DCMAKE_SYSTEM_NAME=Windows ^
                -DCMAKE_SYSTEM_VERSION="10.0" ^
                -A${{ matrix.arch }} ^
                -S . -B build

      - name: Build
        run: cmake --build build --target joy_topdown_template --config Release

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: joy_topdown_template-Windows-${{ matrix.arch }}
          retention-days: 7
          path: |
            build/Release/**
